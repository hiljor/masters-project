[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "horse_algos"
version = "0.1.0"
description = "Algorithmic graph-cut solvers for bounded node removal"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
]
dependencies = []

[project.optional-dependencies]
milp = ["ortools>=9.15.6755"]
development = ["pytest>=8", "scikit-build-core>=0.11", "pybind11>=2.12"]

[project.urls]
Repository = "https://github.com/hiljor/masters-project"

[tool.scikit-build]
wheel.expand-macos-universal-tags = true
cmake.version = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]